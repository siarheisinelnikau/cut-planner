[package]
name = "cut-planner"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A practical guillotine cutting planner for sheet materials"
repository = "https://github.com/siarheisinelnikau/cut-planner"
build = "build.rs"

[lib]
name = "cut_planner"

[[bin]]
name = "CutPlanner"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
egui = { version = "=0.33.3", features = ["accesskit"] }
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard", "accesskit"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "=0.4.8", default-features = false }
rfd = { version = "=0.15.4", default-features = false }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "json"] }
sha2 = "=0.10.9"
semver = "=1.0.28"
png = "=0.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
winresource = "=0.1.34"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
strip = "debuginfo"

